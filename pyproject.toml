[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lms-video-downloader"
version = "0.1.0"
description = "A provider-neutral LMS video download engine and CLI for authorized media requests"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "ch1tmdgus"}]
classifiers = ["Programming Language :: Python :: 3", "Operating System :: OS Independent"]

[project.scripts]
lms-download = "lms_downloader.cli:main"

[tool.setuptools.packages.find]
include = ["lms_downloader*"]
